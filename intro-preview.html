<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>AJM intro preview</title>
<style>html,body{margin:0;height:100%;background:#000;color:#aaa;font:14px "Helvetica Neue",Arial,sans-serif}video{width:100%;height:100%;object-fit:contain;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px;display:flex;gap:12px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.8))}
button,a{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:8px 16px;font:inherit;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#333}</style></head>
<body><video id="v" src="media/intro.mp4" playsinline preload="auto"></video>
<div class="bar"><button id="r">▶ Replay with sound</button><button id="l">Loop: off</button><a href="./">Open the full site</a></div>
<script>const v=document.getElementById('v');document.getElementById('r').onclick=()=>{v.muted=false;v.currentTime=0;v.play()};
document.getElementById('l').onclick=e=>{v.loop=!v.loop;e.target.textContent='Loop: '+(v.loop?'on':'off');if(v.loop){v.currentTime=0;v.play()}};
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){v.muted=false;v.currentTime=0;v.play()}});v.muted=true;v.play().catch(()=>{});</script></body></html>
